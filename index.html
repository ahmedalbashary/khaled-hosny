<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشيف خالد - وين تفطر؟</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0a2e; --bg2: #2d1155;
    --yellow: #FFD700; --orange: #FF6B00; --red: #FF2D55;
    --green: #00C896; --blue: #00AAFF; --purple: #9B5DFF;
    --white: #FFFFFF; --text-main: #FFF5CC;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, #fff 0%, transparent 100%),
      radial-gradient(2px 2px at 50% 70%, #ffd700 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, #fff 0%, transparent 100%),
      radial-gradient(2px 2px at 85% 65%, rgba(255,215,0,0.6) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity:0.5; } 100% { opacity:1; } }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    transition: opacity 0.5s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ---- SCREEN 1 ---- */
  #screen-open {
    background: radial-gradient(ellipse at center, #3a1a6e 0%, #1a0a2e 70%);
    text-align: center; padding: 2rem; gap: 2rem;
  }
  .open-emoji {
    font-size: clamp(4rem,15vw,7rem);
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.7));
  }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-20px) rotate(5deg);} }
  .open-question {
    font-size: clamp(1.8rem,6vw,3.5rem);
    font-weight: 900; color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 4px 0 rgba(0,0,0,0.4);
    line-height: 1.3;
    animation: pulse-text 2s ease-in-out infinite alternate;
  }
  @keyframes pulse-text {
    0%   { text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 4px 0 rgba(0,0,0,0.4); }
    100% { text-shadow: 0 0 50px rgba(255,215,0,1),   0 4px 0 rgba(0,0,0,0.4); }
  }
  .btn-main {
    background: linear-gradient(135deg, var(--orange), var(--red));
    color: #fff; border: none; outline: none; cursor: pointer;
    padding: 1rem 3rem;
    font-size: clamp(1.2rem,4vw,1.8rem);
    font-family: 'Cairo', sans-serif; font-weight: 800;
    border-radius: 60px;
    box-shadow: 0 8px 30px rgba(255,107,0,0.5), 0 0 0 4px rgba(255,107,0,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: btn-bounce 1.5s ease-in-out infinite;
  }
  .btn-main:hover { transform: scale(1.08) translateY(-3px); box-shadow: 0 12px 40px rgba(255,107,0,0.8); }
  @keyframes btn-bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  /* ---- SCREEN 2 INTRO ---- */
  #screen-intro { background: #000; flex-direction: column; gap: 1.5rem; overflow: hidden; }
  .intro-top {
    font-size: clamp(1rem,3vw,1.5rem);
    color: rgba(255,255,255,0.5); opacity: 0;
  }
  .intro-big {
    font-size: clamp(2rem,10vw,6rem); font-weight: 900;
    color: var(--yellow); text-align: center;
    opacity: 0; transform: scale(0.05);
    text-shadow: 0 0 60px rgba(255,215,0,0.8);
    line-height: 1.2;
  }
  .intro-big.animate { animation: zoom-in-dramatic 1.5s cubic-bezier(0.23,1,0.32,1) forwards; }
  .intro-top.animate { animation: fade-slide-up 0.8s ease forwards 0.3s; }
  @keyframes zoom-in-dramatic {
    0%  { opacity:0; transform:scale(0.03); }
    60% { opacity:1; transform:scale(1.15); }
    80% { transform:scale(0.95); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fade-slide-up {
    0%  { opacity:0; transform:translateY(30px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .intro-stars { position:absolute; inset:0; pointer-events:none; overflow:hidden; }

  /* ---- SCREEN 3 GAME ---- */
  #screen-game {
    background: radial-gradient(ellipse at 30% 50%, #3a1a6e 0%, #1a0a2e 60%);
    flex-direction: row; align-items: center; justify-content: center;
    gap: clamp(1rem,4vw,3rem); padding: clamp(1rem,3vw,2rem);
    flex-wrap: wrap;
  }
  .chef-area { display:flex; flex-direction:column; align-items:center; gap:0.5rem; flex-shrink:0; }
  .chef-bubble {
    background: var(--yellow); color: #1a0a2e;
    border-radius: 20px 20px 20px 4px;
    padding: 0.5rem 1rem;
    font-size: clamp(0.8rem,2.5vw,1rem); font-weight:800;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    animation: bubble-bob 2s ease-in-out infinite;
    position: relative; white-space: nowrap;
  }
  .chef-bubble::after {
    content:''; position:absolute; bottom:-10px; right:16px;
    border:6px solid transparent; border-top-color:var(--yellow);
  }
  @keyframes bubble-bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  .chef-img-wrap { position:relative; width:clamp(140px,28vw,220px); }
  .chef-img-wrap img {
    width:100%; border-radius:20px;
    filter: drop-shadow(0 10px 30px rgba(255,215,0,0.5));
    display: block;
  }

  /* Chef glow platform */
  .chef-platform {
    width: clamp(120px, 24vw, 190px);
    height: 20px;
    background: radial-gradient(ellipse, rgba(255,215,0,0.4) 0%, transparent 70%);
    margin-top: -8px;
  }

  .chef-idle    { animation: chef-idle    1.8s ease-in-out infinite; }
  .chef-excited { animation: chef-excited 0.4s ease-in-out infinite alternate; }
  .chef-celebrate{ animation: chef-celebrate 0.5s ease-in-out infinite alternate; }
  @keyframes chef-idle     { 0%,100%{transform:translateY(0) rotate(0deg);} 30%{transform:translateY(-8px) rotate(-1deg);} 70%{transform:translateY(-4px) rotate(1deg);} }
  @keyframes chef-excited  { 0%{transform:translateY(0) rotate(-3deg) scale(1);} 100%{transform:translateY(-12px) rotate(3deg) scale(1.05);} }
  @keyframes chef-celebrate{ 0%{transform:translateY(0) rotate(-5deg) scale(1);} 100%{transform:translateY(-18px) rotate(6deg) scale(1.08);} }

  .wheel-area { display:flex; flex-direction:column; align-items:center; gap:1rem; }
  .wheel-wrap {
    position:relative; display:inline-flex;
    align-items:center; justify-content:center;
  }
  .wheel-wrap::before {
    content:''; position:absolute; inset:-12px; border-radius:50%;
    background: conic-gradient(from 0deg, var(--yellow), var(--orange), var(--red), var(--purple), var(--blue), var(--green), var(--yellow));
    animation: spin-ring 4s linear infinite; z-index:0;
  }
  .wheel-wrap::after {
    content:''; position:absolute; inset:-4px; border-radius:50%;
    background: var(--bg); z-index:1;
  }
  @keyframes spin-ring { to{transform:rotate(360deg);} }

  canvas#wheel { position:relative; z-index:2; border-radius:50%; cursor:pointer;
    filter:drop-shadow(0 0 20px rgba(255,215,0,0.4));
    width:clamp(240px,50vw,380px); height:clamp(240px,50vw,380px); }

  .wheel-pointer {
    position:absolute; top:50%; right:-22px;
    transform:translateY(-50%); z-index:10;
    font-size:2.5rem;
    filter:drop-shadow(0 0 8px rgba(255,107,0,0.8));
    animation:pointer-pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pointer-pulse { 0%{transform:translateY(-50%) scale(1);} 100%{transform:translateY(-50%) scale(1.2);} }

  .wheel-hub {
    position:absolute; z-index:10;
    width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle, #fff 30%, #ffd700 70%, #ff6b00 100%);
    box-shadow:0 0 20px rgba(255,215,0,0.8), inset 0 0 8px rgba(0,0,0,0.3);
    border:4px solid #fff;
  }

  .btn-spin {
    background:linear-gradient(135deg, var(--green), #00a876);
    color:#fff; border:none; outline:none; cursor:pointer;
    padding:0.9rem 2.5rem;
    font-size:clamp(1.1rem,3.5vw,1.5rem);
    font-family:'Cairo',sans-serif; font-weight:800; border-radius:50px;
    box-shadow:0 6px 25px rgba(0,200,150,0.5);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .btn-spin:hover:not(:disabled) { transform:scale(1.06) translateY(-2px); box-shadow:0 10px 35px rgba(0,200,150,0.7); }
  .btn-spin:disabled { opacity:0.5; cursor:not-allowed; }

  /* ---- SCREEN 4 RESULT ---- */
  #screen-result {
    background:radial-gradient(ellipse at center, #3a1a6e 0%, #1a0a2e 70%);
    flex-direction:column; align-items:center; gap:1.2rem;
    text-align:center; padding:2rem;
  }
  .result-tada { font-size:clamp(3rem,10vw,6rem); animation:tada 0.8s ease infinite alternate; }
  @keyframes tada { 0%{transform:scale(1) rotate(-5deg);} 100%{transform:scale(1.15) rotate(5deg);} }
  .result-label { font-size:clamp(0.9rem,3vw,1.2rem); color:rgba(255,255,255,0.7); font-weight:700; }
  .result-name {
    font-size:clamp(2rem,8vw,4rem); font-weight:900; color:var(--yellow);
    text-shadow:0 0 30px rgba(255,215,0,0.8), 0 4px 0 rgba(0,0,0,0.4);
    animation:name-glow 1s ease-in-out infinite alternate;
  }
  @keyframes name-glow {
    0%  {text-shadow:0 0 20px rgba(255,215,0,0.6),0 4px 0 rgba(0,0,0,0.4);}
    100%{text-shadow:0 0 50px rgba(255,215,0,1),  0 4px 0 rgba(0,0,0,0.4);}
  }
  .result-phone-wrap {
    background:rgba(255,255,255,0.07); border:2px solid rgba(255,215,0,0.3);
    border-radius:20px; padding:1rem 2.5rem; backdrop-filter:blur(10px);
  }
  .result-phone-label { font-size:clamp(0.8rem,2.5vw,1rem); color:rgba(255,255,255,0.6); margin-bottom:0.3rem; }
  .result-phone {
    font-size:clamp(1.5rem,5vw,2.5rem); font-weight:900; color:var(--green);
    letter-spacing:2px; direction:ltr;
    text-shadow:0 0 20px rgba(0,200,150,0.5);
  }
  .result-chef-wrap { width:clamp(100px,22vw,160px); }
  .result-chef-wrap img { width:100%; border-radius:16px; filter:drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
  .btn-again {
    background:linear-gradient(135deg,var(--purple),var(--blue));
    color:#fff; border:none; outline:none; cursor:pointer;
    padding:0.8rem 2.2rem; font-size:clamp(1rem,3vw,1.3rem);
    font-family:'Cairo',sans-serif; font-weight:800; border-radius:50px;
    box-shadow:0 6px 25px rgba(155,93,255,0.5); transition:transform 0.15s; margin-top:0.5rem;
  }
  .btn-again:hover { transform:scale(1.06) translateY(-2px); }

  #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:9999; }

  .food-float {
    position:fixed; font-size:1.8rem; pointer-events:none; z-index:1;
    opacity:0.12; animation:food-float-anim linear infinite;
  }
  @keyframes food-float-anim {
    0%  {transform:translateY(110vh) rotate(0deg); opacity:0;}
    10% {opacity:0.12;}
    90% {opacity:0.12;}
    100%{transform:translateY(-10vh) rotate(360deg); opacity:0;}
  }

  @media (max-width: 600px) {
    #screen-game { flex-direction:column; justify-content:flex-start; padding-top:1.5rem; overflow-y:auto; }
    .wheel-pointer { right:-16px; font-size:2rem; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- SCREEN 1 -->
<div id="screen-open" class="screen">
  <div class="open-emoji">🍽️</div>
  <h1 class="open-question">محتار تفطر<br>ايه النهاردة؟</h1>
  <button class="btn-main" onclick="startIntro()">👨‍🍳 تحب اساعدك</button>
</div>

<!-- SCREEN 2 -->
<div id="screen-intro" class="screen hidden">
  <div class="intro-stars" id="intro-stars"></div>
  <p class="intro-top" id="intro-top">يلا يا صاحبي...</p>
  <h2 class="intro-big" id="intro-big">الشيف خالد<br>هيساعدك 🎉</h2>
</div>

<!-- SCREEN 3 -->

<script>
// =============================================
// CONFIGURATION — edit names & phone numbers here
// =============================================
const RESTAURANTS = [
  { name:"عم ابراهيم",       phone:"01002967524", emoji:"🥙", color:"#FF6B35" },
  { name:"بطاطسيكو",         phone:"01145014449", emoji:"🍟", color:"#e6b800" },
  { name:"حماده شيراتون",    phone:"15916", emoji:"🍗", color:"#00C896" },
  { name:"عم بشندي",         phone:"01016317587", emoji:"🧆", color:"#9B5DFF" }
];

// =============================================
// AUDIO
// =============================================
let audioCtx = null;
function getAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playBeep(freq=440,type='sine',dur=0.1,vol=0.3){
  try{ const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.start();o.stop(c.currentTime+dur); }catch(e){}
}
function playWhoosh(){
  try{ const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sawtooth';
    o.frequency.setValueAtTime(800,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(100,c.currentTime+0.4);
    g.gain.setValueAtTime(0.2,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);
    o.start();o.stop(c.currentTime+0.4); }catch(e){}
}
function playCelebration(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>playBeep(f,'square',0.2,0.25),i*120)); }
function playTick(){ playBeep(600+Math.random()*200,'square',0.04,0.15); }

// =============================================
// FLOATING FOOD
// =============================================
['🥙','🍟','🍗','🧆','🥚','🍕','☕','🥪'].forEach(em=>{
  const el=document.createElement('div');
  el.className='food-float'; el.textContent=em;
  el.style.left=Math.random()*100+'vw';
  el.style.animationDuration=(8+Math.random()*12)+'s';
  el.style.animationDelay=(Math.random()*10)+'s';
  document.body.appendChild(el);
});

// =============================================
// SCREENS
// =============================================
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startIntro(){
  playWhoosh();
  showScreen('screen-intro');
  const big=document.getElementById('intro-big');
  const top=document.getElementById('intro-top');
  big.classList.remove('animate'); top.classList.remove('animate');
  void big.offsetWidth;
  big.classList.add('animate'); top.classList.add('animate');
  spawnIntroStars();
  [261,329,392,523].forEach((f,i)=>setTimeout(()=>playBeep(f,'triangle',0.8,0.2),i*80));
  setTimeout(()=>{ showScreen('screen-game'); drawWheel(); }, 2800);
}

function spawnIntroStars(){
  const c=document.getElementById('intro-stars'); c.innerHTML='';
  const colors=['#FFD700','#FF6B00','#FF2D55','#00C896','#9B5DFF'];
  for(let i=0;i<50;i++){
    const s=document.createElement('div');
    const sz=4+Math.random()*10;
    const angle=Math.random()*360, dist=100+Math.random()*250;
    const tx=Math.cos(angle*Math.PI/180)*dist, ty=Math.sin(angle*Math.PI/180)*dist;
    s.style.cssText=`position:absolute;border-radius:50%;
      background:${colors[Math.floor(Math.random()*5)]};
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      animation:star-pop 1.5s ease-out ${Math.random()*0.8}s forwards;
      --tx:${tx}px;--ty:${ty}px;`;
    c.appendChild(s);
  }
  if(!document.getElementById('star-kf')){
    const st=document.createElement('style'); st.id='star-kf';
    st.textContent='@keyframes star-pop{0%{opacity:0;transform:scale(0) translate(0,0);}30%{opacity:1;}100%{opacity:0;transform:scale(1) translate(var(--tx),var(--ty));}}';
    document.head.appendChild(st);
  }
}

// =============================================
// WHEEL
// =============================================
const N=RESTAURANTS.length, SEG=2*Math.PI/N;
let rot=0, spinning=false;

function drawWheel(hl=-1){
  const canvas=document.getElementById('wheel');
  const size=canvas.clientWidth||340;
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d'), cx=size/2, cy=size/2, r=size/2-4;
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<N;i++){
    const sa=rot+i*SEG, ea=sa+SEG, rs=RESTAURANTS[i];
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sa,ea); ctx.closePath();
    ctx.fillStyle=i===hl?'#FFFFFF':rs.color; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(sa+SEG/2);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.font=`bold ${Math.max(12,size*0.053)}px Cairo,sans-serif`;
    ctx.fillStyle=i===hl?rs.color:'#FFF';
    ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
    ctx.fillText(rs.name,r-12,0); ctx.restore();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(sa+SEG/2);
    ctx.font=`${Math.max(14,size*0.07)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowBlur=0;
    ctx.fillText(rs.emoji,r*0.35,0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3; ctx.stroke();
}

function spinWheel(){
  if(spinning) return;
  spinning=true;
  document.getElementById('btn-spin').disabled=true;
  document.getElementById('chef-img').className='chef-excited';
  document.getElementById('chef-bubble').textContent='بيدور... بيدور! 🎡';
  playWhoosh();

  const idx=Math.floor(Math.random()*N);
  const target=2*Math.PI-(idx*SEG+SEG/2);
  const total=(5+Math.floor(Math.random()*6))*2*Math.PI + target - (rot%(2*Math.PI));
  const dur=4000+Math.random()*1500;
  let start=null, lastTick=rot;

  function ease(t){ return 1-Math.pow(1-t,4); }
  function frame(ts){
    if(!start) start=ts;
    const p=Math.min((ts-start)/dur,1), e=ease(p);
    rot=(rot%(2*Math.PI))+e*total;
    if(Math.abs(rot-lastTick)>SEG*0.8){ playTick(); lastTick=rot; }
    drawWheel();
    if(p<1){ requestAnimationFrame(frame); }
    else {
      rot=target%(2*Math.PI)+Math.floor(rot/(2*Math.PI))*(2*Math.PI);
      drawWheel(idx); spinning=false;
      document.getElementById('btn-spin').disabled=false;
      document.getElementById('chef-img').className='chef-celebrate';
      document.getElementById('chef-bubble').textContent='🎊 لقيناها!';
      playCelebration(); launchConfetti();
      setTimeout(()=>showResult(idx),1500);
    }
  }
  requestAnimationFrame(frame);
}

// =============================================
// RESULT
// =============================================
const EMOJIS=['🎉','🔥','🙌','🤩','💥','🥳','⭐','🎊'];
function showResult(i){
  const r=RESTAURANTS[i];
  document.getElementById('result-name').textContent=r.emoji+' '+r.name;
  document.getElementById('result-phone').textContent=r.phone;
  document.getElementById('result-emoji').textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  showScreen('screen-result'); launchConfetti(); playCelebration();
}

function resetGame(){
  stopConfetti();
  document.getElementById('chef-img').className='chef-idle';
  document.getElementById('chef-bubble').textContent='دوّر الحظ! 🎰';
  rot=0; showScreen('screen-game'); drawWheel();
}

// =============================================
// CONFETTI
// =============================================
let pieces=[], cfFrame=null;
function launchConfetti(){
  const cv=document.getElementById('confetti-canvas');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  const cols=['#FFD700','#FF6B00','#FF2D55','#00C896','#9B5DFF','#00AAFF','#FF69B4'];
  pieces=Array.from({length:130},()=>({
    x:Math.random()*cv.width, y:-10-Math.random()*200,
    vx:(Math.random()-0.5)*4, vy:3+Math.random()*5,
    rot:Math.random()*360, rotV:(Math.random()-0.5)*8,
    w:6+Math.random()*10, h:4+Math.random()*6,
    color:cols[Math.floor(Math.random()*cols.length)], alpha:1
  }));
  if(cfFrame) cancelAnimationFrame(cfFrame);
  animConf();
}
function animConf(){
  const cv=document.getElementById('confetti-canvas');
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  pieces.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV; p.vy+=0.1;
    if(p.y>cv.height) p.alpha-=0.05;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  pieces=pieces.filter(p=>p.alpha>0);
  if(pieces.length>0) cfFrame=requestAnimationFrame(animConf);
  else stopConfetti();
}
function stopConfetti(){
  if(cfFrame) cancelAnimationFrame(cfFrame);
  const cv=document.getElementById('confetti-canvas');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

window.addEventListener('resize',()=>{
  if(!document.getElementById('screen-game').classList.contains('hidden')) drawWheel();
});
window.addEventListener('load',()=>drawWheel());
</script>
